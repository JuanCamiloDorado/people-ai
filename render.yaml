# Blueprint de Render. Con este archivo el servicio se crea desde el repositorio y
# la configuracion viaja en git: si alguien borra una variable en el panel, vuelve
# al redesplegar. Las marcadas `sync: false` son secretos y se introducen una sola
# vez en el panel; no se guardan aqui.
#
# Sin NODE_OPTIONS a proposito: una variable de servicio aplica tambien al build,
# donde Vite necesita margen de memoria. Si el runtime se quedara corto, el sitio
# para un `--max-old-space-size` es `startCommand`, nunca una variable global.
services:
  - type: web
    name: people-ai
    runtime: node
    plan: free
    # Misma region que el cluster TiDB (us-east-1): menos latencia por consulta,
    # que con el arranque en frio del plan gratuito se nota.
    region: virginia
    branch: main
    # Sin `--prod`: el build necesita vite, esbuild y typescript. pnpm es
    # obligatorio (patch de wouter y overrides en package.json); corepack lo
    # instala en la version que fija `packageManager`.
    buildCommand: corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm build
    # `node` directo y no `pnpm start`: en runtime no debe hacer falta el gestor
    # de paquetes para nada. Es exactamente lo que hace el script `start`.
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Cadena de conexion a TiDB Cloud (puerto 4000, TLS obligatorio).
      - key: DATABASE_URL
        sync: false
      # Minimo 32 caracteres o el servidor no arranca. Generar con: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      - key: REMINDER_COOLDOWN_HOURS
        value: "4"
      # Almacenamiento S3-compatible de los documentos del portal del candidato.
      # Cualquier proveedor con API S3 sirve (Cloudflare R2, Backblaze B2, AWS S3):
      # el codigo no tiene ninguna rama por proveedor. Endpoint y bucket identifican
      # la cuenta y cambian entre entornos, y las dos claves son secretos, asi que los
      # cuatro van con `sync: false`. Region y path-style si viajan en git: no revelan
      # nada. Sin estas variables el servicio arranca igual y solo cae el portal del
      # candidato, pero el log de arranque lo dice (`logStorageEnvStatus`).
      - key: STORAGE_S3_ENDPOINT
        sync: false
      # "auto" es lo que exige R2. Con AWS S3 real va la region del bucket.
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # "true" solo hace falta con MinIO. R2, B2 y S3 funcionan con el valor por defecto.
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "false"
